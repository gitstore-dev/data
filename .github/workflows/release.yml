name: Publish data release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed version tag (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: data-publication-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'gitstore-dev/data' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: data-release
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      DATA_TAG: ${{ inputs.tag }}
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.12'
          cache: pip
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.11'
          cache-dependency-path: tools/registry/go.sum
      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt
      - name: Build release-only ORAS helper
        run: go -C tools/registry build -mod=readonly -o "$RUNNER_TEMP/seed-registry" .
      - name: Validate source and prepare or resume release-time bundles
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: >-
          python tools/releases.py prepare --tag "$DATA_TAG"
          --work-dir "$RUNNER_TEMP/data-release"
          --registry-helper "$RUNNER_TEMP/seed-registry"
      - name: Attest final release assets and OCI manifest bytes
        id: attest
        if: steps.prepare.outputs.needs_attestation == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ${{ runner.temp }}/data-release/assets/*
          push-to-registry: false
          create-storage-record: false
      - name: Verify provenance, publish versioned bundles and read back
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
          PROVENANCE_PATH: ${{ steps.attest.outputs.bundle-path }}
        shell: bash
        run: |
          provenance_args=()
          if [[ -n "$PROVENANCE_PATH" ]]; then
            provenance_args=(--provenance "$PROVENANCE_PATH")
          fi
          python tools/releases.py publish --tag "$DATA_TAG" \
            --work-dir "$RUNNER_TEMP/data-release" \
            --registry-helper "$RUNNER_TEMP/seed-registry" "${provenance_args[@]}"
